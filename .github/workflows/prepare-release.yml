name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 0.2.0
        required: true
        type: string
      target:
        description: Branch or full commit SHA to release
        required: true
        default: master
        type: string
      previous_tag:
        description: Optional tag where generated notes should begin
        required: false
        type: string

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.validated.outputs.target_sha }}
      version: ${{ steps.validated.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z without a v prefix" >&2
            exit 1
          fi

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "manifest.json is $MANIFEST_VERSION, not $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a release" >&2
            exit 1
          fi

      - name: Record validated release
        id: validated
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          node --check tests/check-upstream.js
          node --test tests/*.test.js

  draft:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          TAG="v$VERSION"
          ARGS=(
            "$TAG"
            --draft
            --fail-on-no-commits
            --generate-notes
            --target "$TARGET_SHA"
            --title "Hijri Date $VERSION"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          RELEASE_URL=$(gh release create "${ARGS[@]}")
          {
            echo "## Draft release ready"
            echo
            echo "Review and edit [$TAG]($RELEASE_URL) under Releases."
            echo "Nothing is published until you click **Publish release**."
          } >> "$GITHUB_STEP_SUMMARY"
